
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10152e">
<title>شفرة العقل - المغامرة</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10152e;color:white;font-family:Tahoma;overflow:hidden;touch-action:none}
#game{width:100%;height:100dvh;position:relative;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.top{
 position:absolute;top:10px;right:10px;left:10px;
 display:flex;justify-content:space-between;align-items:center;
 pointer-events:none
}
.pill{background:#111b3add;border:1px solid #6575ba;border-radius:15px;padding:9px 13px;font-size:13px}
.controls{
 position:absolute;bottom:20px;left:0;right:0;
 display:flex;justify-content:space-between;padding:0 18px;
 align-items:end;pointer-events:none
}
.group{display:flex;gap:12px;pointer-events:auto}
.control{
 width:62px;height:62px;border-radius:50%;border:2px solid #aab8ff;
 background:#26366ddd;color:white;font-size:26px;
 touch-action:none;box-shadow:0 4px 15px #0008
}
.control:active{background:#7566e8}
#jump{width:75px;height:75px;background:#704fd8}
#message{
 position:absolute;bottom:115px;left:10px;right:10px;
 text-align:center;color:white;text-shadow:0 2px 5px black;
 font-size:14px;pointer-events:none
}
#intro,#puzzle,#ending{
 position:absolute;inset:0;background:#080d20ed;
 display:flex;align-items:center;justify-content:center;padding:20px;
}
.box{
 width:100%;max-width:440px;background:#202c53;
 border:1px solid #8193d6;border-radius:24px;
 padding:22px;text-align:center;box-shadow:0 10px 50px #0009
}
h1{color:#c4caff;margin:8px}
p{line-height:1.8;color:#e0e4ff}
.action,.answer{
 display:block;width:100%;border:0;border-radius:13px;
 padding:14px;margin-top:11px;font-size:16px;font-weight:bold;
 color:white;background:linear-gradient(100deg,#6564ee,#984de0)
}
.answer{background:#354575;border:1px solid #7284c5;text-align:center}
.answer:active{background:#6654bb}
.hidden{display:none!important}
#resultText{font-size:17px}
</style>
</head>
<body>
<div id="game">
<canvas id="world"></canvas>

<div class="top">
 <div class="pill">🧠 شفرة العقل</div>
 <div class="pill">⭐ <span id="score">0</span></div>
 <div class="pill">🚪 <span id="level">1</span></div>
</div>

<div id="message">تحرك نحو الباب واكتشف السر!</div>

<div class="controls">
 <div class="group">
  <button class="control" id="right">▶</button>
  <button class="control" id="left">◀</button>
 </div>
 <button class="control" id="jump">⬆</button>
</div>

<div id="intro">
 <div class="box">
  <div style="font-size:70px">🏰</div>
  <h1>مغامرة العقول</h1>
  <p>ساعد آدم وزيرو في استكشاف القصر الغامض. تحرك واقفز، وقابل لونا، وحل الألغاز لفتح الأبواب!</p>
  <button class="action" id="start">ابدأ المغامرة 🚀</button>
 </div>
</div>

<div id="puzzle" class="hidden">
 <div class="box">
  <div style="font-size:48px">🧙‍♀️</div>
  <h2>لونا الساحرة</h2>
  <p id="story">لن تفتح البوابة إلا إذا حللت اللغز!</p>
  <h3 id="question"></h3>
  <div id="answers"></div>
  <p id="feedback"></p>
  <button class="action hidden" id="continue">تابع المغامرة</button>
 </div>
</div>

<div id="ending" class="hidden">
 <div class="box">
  <div style="font-size:70px">🏆</div>
  <h1>بطل العقول!</h1>
  <p id="resultText">لقد أكملت المغامرة!</p>
  <button class="action" onclick="restart()">العب من جديد</button>
 </div>
</div>
</div>

<script>
const canvas=document.getElementById("world");
const ctx=canvas.getContext("2d");

let W=900,H=600,scale=1;
let running=false,paused=false;
let score=Number(localStorage.getItem("brainScore")||0);
let level=Number(localStorage.getItem("brainLevel")||1);
let camera=0,frame=0;
let keys={left:false,right:false};
let player={x:100,y:420,vx:0,vy:0,ground:false};
let robot={x:45,y:360};
let doorX=760;
let solved={};
let currentPuzzle=null;

document.getElementById("score").textContent=score;
document.getElementById("level").textContent=level;

function resize(){
 const dpr=Math.min(devicePixelRatio||1,2);
 W=900;H=600;
 canvas.width=W*dpr;canvas.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize();
window.addEventListener("resize",resize);

function rounded(x,y,w,h,r,color){
 ctx.fillStyle=color;ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);ctx.fill();
}
function circle(x,y,r,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function line(x1,y1,x2,y2,color,width){
 ctx.strokeStyle=color;ctx.lineWidth=width;
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}

function drawBackground(){
 let sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,"#182452");
 sky.addColorStop(1,"#566c9a");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

 for(let i=0;i<45;i++){
  let x=(i*173-camera*.12+W*10)%W;
  let y=(i*79)%270;
  circle(x,y,1.5,"#ffffffaa");
 }
 // القمر
 circle(750,95,43,"#fff0bd");
 circle(765,80,43,"#263b70");

 // الجبال
 ctx.fillStyle="#273c66";
 ctx.beginPath();ctx.moveTo(0,400);
 for(let x=0;x<=W;x+=100)ctx.lineTo(x,300+Math.sin((x+camera*.1)/100)*45);
 ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();

 // القلعة
 ctx.fillStyle="#29375d";
 ctx.fillRect(570,205,260,300);
 ctx.fillRect(550,175,55,330);
 ctx.fillRect(790,175,55,330);
 for(let x of [550,790]){
  ctx.fillStyle="#50618d";
  ctx.fillRect(x-5,160,65,20);
 }
 ctx.fillStyle="#1b2447";
 ctx.fillRect(665,370,75,135);
 ctx.beginPath();ctx.arc(702,370,37,Math.PI,0);ctx.fill();
 ctx.fillStyle="#f5d67d";
 ctx.fillRect(690,420,23,85);
 circle(705,460,4,"#fff4ba");
}

function drawGround(){
 ctx.fillStyle="#263b3b";ctx.fillRect(0,500,W,100);
 ctx.fillStyle="#3d805c";ctx.fillRect(0,495,W,12);
 for(let x=0;x<W;x+=35){
  line(x,495,x+10,485,"#75c77a",3);
 }
 // منصات
 rounded(300,420,120,18,7,"#71805c");
 rounded(455,365,110,18,7,"#71805c");
 rounded(650,430,100,18,7,"#71805c");
}

function drawTree(x,y){
 ctx.fillStyle="#69462e";ctx.fillRect(x-8,y-65,16,65);
 circle(x,y-80,32,"#267d5d");
 circle(x-20,y-65,20,"#32946b");
 circle(x+19,y-66,22,"#23835b");
}

function drawAdam(x,y){
 ctx.save();ctx.translate(x,y);
 let walk=Math.sin(frame*.22)*5*(Math.abs(player.vx)>.1?1:0);
 // الظل
 ctx.globalAlpha=.25;circle(0,0,23,"#000");ctx.globalAlpha=1;
 // الرجلان
 line(-8,-30,-10+walk,-5,"#263c75",9);
 line(8,-30,10-walk,-5,"#263c75",9);
 rounded(-20+walk,-8,18,8,4,"#161d38");
 rounded(4-walk,-8,18,8,4,"#161d38");
 // الجسم
 rounded(-19,-68,38,40,10,"#2872b8");
 rounded(-19,-45,38,9,4,"#e2b65b");
 // الذراعان
 line(-17,-62,-27,-36,"#e8b78d",8);
 line(17,-62,27,-38,"#e8b78d",8);
 // الرأس
 circle(0,-84,22,"#edbd91");
 // الشعر
 ctx.fillStyle="#30233b";
 ctx.beginPath();ctx.arc(0,-91,22,Math.PI,Math.PI*2);ctx.fill();
 ctx.fillRect(-21,-95,42,9);
 // العين
 circle(-7,-83,3,"#18223d");circle(7,-83,3,"#18223d");
 // وشاح
 rounded(-19,-69,38,8,3,"#e6c34c");
 ctx.restore();
}

function drawRobot(x,y){
 ctx.save();ctx.translate(x,y);
 let bob=Math.sin(frame*.09)*7;
 // هوائي
 line(0,-65,0,-80,"#9caaff",3);
 circle(0,-83,5,"#ffdf73");
 rounded(-22,-62,44,42,12,"#9baed4");
 rounded(-17,-54,34,23,7,"#263b68");
 circle(-8,-43,4,"#62f4e3");circle(8,-43,4,"#62f4e3");
 rounded(-18,-20,36,9,5,"#657aa8");
 line(-22,-48,-33,-35,"#a9b9df",6);
 line(22,-48,33,-35,"#a9b9df",6);
 ctx.restore();
}

function drawWizard(x,y){
 ctx.save();ctx.translate(x,y);
 // عباءة
 ctx.fillStyle="#774bd0";
 ctx.beginPath();ctx.moveTo(-24,-8);ctx.lineTo(-18,-65);
 ctx.lineTo(18,-65);ctx.lineTo(25,-8);ctx.fill();
 // وجه
 circle(0,-77,18,"#efc39e");
 // شعر
 ctx.fillStyle="#573b83";
 ctx.beginPath();ctx.arc(0,-83,19,Math.PI,Math.PI*2);ctx.fill();
 // قبعة
 ctx.fillStyle="#633cc2";
 ctx.beginPath();ctx.moveTo(-25,-91);ctx.lineTo(0,-135);
 ctx.lineTo(25,-91);ctx.closePath();ctx.fill();
 ctx.fillRect(-27,-94,54,7);
 circle(-6,-76,2,"#222");circle(6,-76,2,"#222");
 // عصا
 line(25,-45,38,-95,"#d8b77a",5);
 circle(38,-99,8,"#a8e8ff");
 ctx.restore();
}

function drawDoor(){
 rounded(doorX-30,390,60,110,12,"#88522d");
 ctx.beginPath();ctx.arc(doorX,390,30,Math.PI,0);ctx.fillStyle="#88522d";ctx.fill();
 rounded(doorX-22,405,44,95,8,"#4c2d36");
 circle(doorX+14,450,4,"#f9db80");
 circle(doorX,380,5,"#fff0a3");
}

function draw(){
 frame++;
 ctx.clearRect(0,0,W,H);
 drawBackground();
 ctx.save();
 ctx.translate(-camera,0);
 drawTree(90,495);drawTree(460,495);
 drawGround();
 drawDoor();
 drawWizard(doorX+75,500);
 drawRobot(player.x-52,player.y-75+Math.sin(frame*.09)*5);
 drawAdam(player.x,player.y);
 ctx.restore();
}

function update(){
 if(!running||paused)return;
 if(keys.right)player.vx=4;
 else if(keys.left)player.vx=-4;
 else player.vx*=.8;

 player.x+=player.vx;
 player.x=Math.max(30,Math.min(850,player.x));
 player.vy+=.55;
 player.y+=player.vy;
 if(player.y>=500){player.y=500;player.vy=0;player.ground=true}
 else player.ground=false;

 camera=Math.max(0,player.x-400);
 if(player.x>doorX-45&&player.x<doorX+45){
  document.getElementById("message").textContent="✨ وصلت للبوابة! اضغط على الباب";
  if(!paused && !solved[level])openPuzzle();
 }else{
  document.getElementById("message").textContent="تحرك نحو الباب واكتشف السر!";
 }
}

function loop(){update();draw();requestAnimationFrame(loop)}
loop();

function bindMove(id,key){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true});
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>
  el.addEventListener(ev,e=>{keys[key]=false})
 );
}
bindMove("left","left");
bindMove("right","right");

document.getElementById("jump").addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(player.ground&&!paused){player.vy=-12;player.ground=false}
});

const puzzles=[
 {q:"شيء تملكه أنت ويستخدمه الآخرون أكثر منك، ما هو؟",
  a:["اسمك","قلمك","حذاؤك"],c:0},
 {q:"شيء إذا نطقت اسمه اختفى، ما هو؟",
  a:["الصمت","الظل","النور"],c:0},
 {q:"له أوراق وليس نباتًا، وله جلد وليس حيوانًا، ما هو؟",
  a:["الكتاب","الشجرة","الحقيبة"],c:0},
 {q:"ما الشيء الذي يمكنك كسره دون لمسه؟",
  a:["الحجر","الوعد","الزجاج"],c:1},
 {q:"يمتلئ بالثقوب لكنه يحتفظ بالماء، ما هو؟",
  a:["الإسفنج","السلة","الشبكة"],c:0}
];

function openPuzzle(){
 paused=true;currentPuzzle=puzzles[(level-1)%puzzles.length];
 document.getElementById("puzzle").classList.remove("hidden");
 document.getElementById("question").textContent=currentPuzzle.q;
 document.getElementById("feedback").textContent="";
 document.getElementById("continue").classList.add("hidden");
 let area=document.getElementById("answers");area.innerHTML="";
 currentPuzzle.a.forEach((a,i)=>{
  let b=document.createElement("button");
  b.className="answer";b.textContent=a;
  b.onclick=()=>checkPuzzle(i,b);
  area.appendChild(b);
 });
}
function checkPuzzle(n,btn){
 let all=document.querySelectorAll(".answer");
 all.forEach(b=>b.disabled=true);
 if(n===currentPuzzle.c){
  score+=20;solved[level]=true;
  document.getElementById("feedback").textContent="🎉 أحسنت! البوابة انفتحت!";
  btn.style.background="#16744e";
  localStorage.setItem("brainScore",score);
  document.getElementById("score").textContent=score;
  document.getElementById("continue").textContent="ادخل البوابة 🚪";
  document.getElementById("continue").classList.remove("hidden");
 }else{
  document.getElementById("feedback").textContent="❌ حاول مرة أخرى! فكر في اللغز.";
  btn.style.background="#90364e";
  all[currentPuzzle.c].disabled=false;
  all[currentPuzzle.c].style.border="2px solid #a5e9ba";
  all.forEach((b,i)=>{if(i!==currentPuzzle.c)b.disabled=false});
 }
}
document.getElementById("continue").onclick=()=>{
 document.getElementById("puzzle").classList.add("hidden");
 paused=false;
 level++;
 if(level>puzzles.length){
  running=false;
  document.getElementById("ending").classList.remove("hidden");
  document.getElementById("resultText").textContent="جمعت "+score+" نقطة وأكملت مغامرة القصر!";
  localStorage.setItem("brainLevel",1);
 }else{
  player.x=80;player.y=500;camera=0;
  document.getElementById("level").textContent=level;
  localStorage.setItem("brainLevel",level);
 }
};
document.getElementById("start").onclick=()=>{
 document.getElementById("intro").classList.add("hidden");
 running=true;paused=false;
 player.x=100;player.y=500;
};
function restart(){
 score=0;level=1;solved={};player.x=100;player.y=500;camera=0;
 localStorage.setItem("brainScore",0);
 localStorage.setItem("brainLevel",1);
 document.getElementById("score").textContent=0;
 document.getElementById("level").textContent=1;
 document.getElementById("ending").classList.add("hidden");
 document.getElementById("intro").classList.remove("hidden");
}
</script>
</body>
</html>
