
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b1c">
<title>شفرة العقل 🧠</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#080b1b;color:white;
 font-family:Arial,sans-serif;text-align:center;overflow-x:hidden
}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none}
.container{width:min(460px,94%);margin:auto;padding:20px 0 40px}
.logo{font-size:55px;animation:glow 2s infinite alternate}
@keyframes glow{to{transform:scale(1.13);filter:drop-shadow(0 0 20px #ae6aff)}}
h1{color:#d3b2ff;text-shadow:0 0 20px #8e4dff;font-size:32px}
.sub{color:#aab4d4;font-size:14px}
.card{
 background:linear-gradient(145deg,#202849eF,#11182feF);
 border:1px solid #7056a8;border-radius:23px;
 padding:22px 16px;margin-top:20px;
 box-shadow:0 12px 40px #0009,0 0 25px #8250ff22
}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.stat{background:#0a1228;border:1px solid #38466d;border-radius:13px;padding:10px 3px;font-size:12px;color:#b7c5e5}
.stat b{display:block;color:#d4b0ff;font-size:20px;margin-top:5px}
#hearts{margin:15px;font-size:23px;letter-spacing:4px}
.timer{width:80px;height:80px;margin:15px auto;border-radius:50%;padding:6px;background:conic-gradient(#a56aff 360deg,#ffffff20 0deg);box-shadow:0 0 20px #9250ff55}
.timer div{background:#10182e;height:100%;border-radius:50%;display:grid;place-items:center;font-size:27px;font-weight:bold}
#question{min-height:95px;display:grid;place-items:center;font-size:25px;line-height:1.7;padding:10px}
input{width:100%;padding:16px;border-radius:13px;border:1px solid #765cbb;background:#080e21;color:white;text-align:center;font-size:23px;outline:none}
button{padding:14px 18px;margin:6px;border:0;border-radius:13px;font-size:16px;font-weight:bold;cursor:pointer;transition:.2s}
button:active{transform:scale(.94)}
.primary{background:linear-gradient(110deg,#7642df,#bd65ff);color:white;box-shadow:0 5px 18px #8549e955}
.secondary{background:#263653;color:#e1eaff}
.diff{display:block;width:100%;margin:9px 0;border:1px solid #53618a;background:#172342;color:white}
.diff.active{background:linear-gradient(90deg,#713fd2,#a354eb);border-color:#d6b4ff}
#message{min-height:30px;margin-top:14px;font-weight:bold}
.good{color:#50ffbd;animation:pop .4s}
.bad{color:#ff7896;animation:shake .3s}
@keyframes pop{50%{transform:scale(1.15)}}
@keyframes shake{25%{transform:translateX(7px)}75%{transform:translateX(-7px)}}
.footer{font-size:12px;color:#7e8cad;margin-top:20px}
.overlay{position:fixed;inset:0;background:#050817ed;display:grid;place-items:center;padding:18px;z-index:4;overflow-y:auto}
.panel{width:min(390px,100%);padding:25px 20px;border-radius:25px;background:linear-gradient(145deg,#202849,#11172c);border:1px solid #9064d0;box-shadow:0 0 45px #8046ff44}
.panel h2{color:#d9baff;font-size:27px}
.hidden{display:none!important}
#game{display:none}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="container">
 <div class="logo">🧠</div>
 <h1>شفرة العقل</h1>
 <p class="sub">عقلك هو سلاحك... هل تستطيع الاستمرار؟</p>

 <div id="game">
  <div class="card">
   <div class="stats">
    <div class="stat">النقاط<b id="score">0</b></div>
    <div class="stat">المستوى<b id="level">1</b></div>
    <div class="stat">أفضل نتيجة<b id="best">0</b></div>
   </div>
   <div id="hearts">❤️ ❤️ ❤️</div>
   <div class="timer" id="timerRing"><div id="timer">20</div></div>
   <div id="question"></div>
   <input id="answer" type="number" inputmode="numeric" placeholder="اكتب الإجابة" disabled>
   <br><br>
   <button class="primary" id="checkBtn" onclick="checkAnswer()">تحقق من الإجابة</button>
   <button class="secondary" id="hintBtn" onclick="showHint()">💡 تلميح</button>
   <div id="message"></div>
  </div>
  <div class="footer">♾️ ألغاز متجددة بلا نهاية</div>
 </div>
</div>

<div class="overlay" id="startScreen">
 <div class="panel">
  <div style="font-size:55px">🔐</div>
  <h2>مرحباً بك في شفرة العقل</h2>
  <p class="sub">اختر مستوى البداية واستعد للتحدي</p>
  <button class="diff active" onclick="chooseDifficulty('easy',this)">🟢 سهل</button>
  <button class="diff" onclick="chooseDifficulty('medium',this)">🟡 متوسط</button>
  <button class="diff" onclick="chooseDifficulty('hard',this)">🔴 صعب</button>
  <button class="diff" onclick="chooseDifficulty('impossible',this)">💀 مستحيل</button>
  <button class="primary" onclick="startGame()">ابدأ المغامرة 🚀</button>
 </div>
</div>

<div class="overlay hidden" id="endScreen">
 <div class="panel">
  <div style="font-size:55px">🏆</div>
  <h2>انتهت المحاولات!</h2>
  <p class="sub" id="finalText"></p>
  <button class="primary" onclick="backToMenu()">العب من جديد 🔥</button>
 </div>
</div>

<script>
// خلفية النجوم المتحركة
const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");
let stars=[];
function resize(){
 canvas.width=innerWidth;canvas.height=innerHeight;
 stars=Array.from({length:100},()=>({
  x:Math.random()*canvas.width,y:Math.random()*canvas.height,
  r:Math.random()*2+.4,s:Math.random()*.6+.15
 }));
}
resize();
addEventListener("resize",resize);
function animate(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 stars.forEach(s=>{
  ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
  ctx.fillStyle="rgba(190,160,255,.8)";ctx.fill();
  s.y-=s.s;if(s.y<0){s.y=canvas.height;s.x=Math.random()*canvas.width}
 });
 requestAnimationFrame(animate);
}
animate();

// إعداد اللعبة
let score=0,level=1,lives=3,time=20;
let difficulty="easy",current=null,clock=null;
let locked=true,hinted=false,streak=0;
const settings={
 easy:{time:25,base:10},
 medium:{time:20,base:30},
 hard:{time:15,base:80},
 impossible:{time:10,base:200}
};
let best=Number(localStorage.getItem("brainBest")||0);
document.getElementById("best").textContent=best;

function chooseDifficulty(d,btn){
 difficulty=d;
 document.querySelectorAll(".diff").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");
}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}

function makePuzzle(){
 let cfg=settings[difficulty];
 let max=Math.min(cfg.base+level*3,5000);
 let type=rand(1,4),a,b,answer,q,h;
 if(type===1){
  a=rand(2,max);b=rand(2,max);
  answer=a+b;q=`🧩 ${a} + ${b} = ؟`;h="اجمع العددين";
 }else if(type===2){
  a=rand(2,max);b=rand(1,a);
  answer=a-b;q=`🧩 ${a} - ${b} = ؟`;h="اطرح الأصغر من الأكبر";
 }else if(type===3){
  a=rand(2,Math.min(9+level,100));
  b=rand(2,Math.min(9+level,100));
  answer=a*b;q=`🧩 ${a} × ${b} = ؟`;h="فكر في جدول الضرب";
 }else{
  let step=rand(2,Math.min(5+level,100));
  let first=rand(1,30);
  answer=first+step*4;
  q=`🔍 أكمل المتتالية:<br>${first} ، ${first+step} ، ${first+step*2} ، ${first+step*3} ، ؟`;
  h="الفرق بين كل رقم والذي يليه ثابت";
 }
 return {q,answer,h};
}

function newQuestion(){
 current=makePuzzle();
 hinted=false;time=settings[difficulty].time;
 document.getElementById("question").innerHTML=current.q;
 document.getElementById("answer").value="";
 document.getElementById("answer").disabled=false;
 document.getElementById("checkBtn").disabled=false;
 document.getElementById("hintBtn").disabled=false;
 document.getElementById("message").textContent="";
 document.getElementById("message").className="";
 locked=false;updateTimer();
 clearInterval(clock);
 clock=setInterval(()=>{
  if(locked)return;
  time--;updateTimer();
  if(time<=0)loseLife("انتهى الوقت! ⏰");
 },1000);
}
function updateTimer(){
 document.getElementById("timer").textContent=time;
 let deg=time/settings[difficulty].time*360;
 document.getElementById("timerRing").style.background=
 `conic-gradient(${time<=5?"#ff5278":"#a56aff"} ${deg}deg,#ffffff20 0deg)`;
}
function checkAnswer(){
 if(locked)return;
 let value=document.getElementById("answer").value.trim();
 if(value==="")return;
 if(Number(value)===current.answer){
  locked=true;clearInterval(clock);streak++;
  let points=10+level+(hinted?0:5);
  score+=points;level++;
  if(streak>=5){
   difficulty=difficulty==="easy"?"medium":
   difficulty==="medium"?"hard":
   difficulty==="hard"?"impossible":"impossible";
   streak=0;
   document.getElementById("message").textContent="🔥 ممتاز! ارتفعت الصعوبة!";
  }else{
   document.getElementById("message").textContent=`🎉 إجابة صحيحة! +${points} نقطة`;
  }
  document.getElementById("message").className="good";
  document.getElementById("answer").disabled=true;
  document.getElementById("checkBtn").disabled=true;
  document.getElementById("hintBtn").disabled=true;
  updateStats();
  setTimeout(newQuestion,1200);
 }else loseLife("إجابة غير صحيحة! ❌");
}
function showHint(){
 if(locked||hinted)return;
 hinted=true;score=Math.max(0,score-5);
 document.getElementById("message").textContent="💡 "+current.h+" (خصم 5 نقاط)";
 updateStats();document.getElementById("hintBtn").disabled=true;
}
function loseLife(msg){
 if(locked)return;
 locked=true;clearInterval(clock);lives--;streak=0;
 document.getElementById("hearts").textContent=
 "❤️ ".repeat(lives)+"🖤 ".repeat(3-lives);
 document.getElementById("message").textContent=msg;
 document.getElementById("message").className="bad";
 document.getElementById("answer").disabled=true;
 document.getElementById("checkBtn").disabled=true;
 document.getElementById("hintBtn").disabled=true;
 if(lives<=0)setTimeout(gameOver,900);
 else setTimeout(newQuestion,1200);
}
function updateStats(){
 document.getElementById("score").textContent=score;
 document.getElementById("level").textContent=level;
 if(score>best){
  best=score;localStorage.setItem("brainBest",best);
  document.getElementById("best").textContent=best;
 }
}
function gameOver(){
 document.getElementById("finalText").textContent=
 `نتيجتك ${score} نقطة، وصلت للمستوى ${level}. حاول تحطم رقمك القياسي!`;
 document.getElementById("endScreen").classList.remove("hidden");
}
function startGame(){
 clearInterval(clock);
 score=0;level=1;lives=3;streak=0;
 document.getElementById("startScreen").classList.add("hidden");
 document.getElementById("endScreen").classList.add("hidden");
 document.getElementById("game").style.display="block";
 document.getElementById("hearts").textContent="❤️ ❤️ ❤️";
 updateStats();newQuestion();
}
function backToMenu(){
 clearInterval(clock);locked=true;
 document.getElementById("endScreen").classList.add("hidden");
 document.getElementById("game").style.display="none";
 document.getElementById("startScreen").classList.remove("hidden");
}
document.getElementById("answer").addEventListener("keydown",e=>{
 if(e.key==="Enter")checkAnswer();
});
</script>
</body>
</html>
